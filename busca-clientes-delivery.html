<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚚 Sistema de Busca de Clientes para Delivery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .search-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .cliente-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e1e5e9;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        
        .cliente-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .endereco-badge {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            font-size: 0.75rem;
        }
        
        .sem-endereco-badge {
            background: linear-gradient(45deg, #ffc107, #fd7e14);
            color: #212529;
            font-size: 0.75rem;
        }
        
        .stats-badge {
            background: linear-gradient(45deg, #6f42c1, #e83e8c);
            color: white;
            font-size: 0.7rem;
        }
        
        .search-input {
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 0.8rem;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-criar {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            color: white;
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
        }
        
        .btn-selecionar {
            background: linear-gradient(45deg, #007bff, #6610f2);
            border: none;
            color: white;
            border-radius: 8px;
            padding: 0.4rem 1rem;
        }
        
        .loading-spinner {
            display: none;
            color: #667eea;
        }
        
        .sugestao-card {
            background: linear-gradient(45deg, #17a2b8, #6c757d);
            color: white;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="text-center text-white mb-5">
            <h1 class="display-4 fw-bold">
                <i class="fas fa-search me-3"></i>
                Busca Inteligente de Clientes
            </h1>
            <p class="lead">Sistema avançado para encontrar e gerenciar clientes para delivery</p>
        </div>

        <!-- Search Card -->
        <div class="search-container mx-auto" style="max-width: 800px;">
            <div class="row align-items-center mb-4">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text bg-primary text-white">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control search-input" 
                               placeholder="Digite telefone, nome, endereço ou email...">
                    </div>
                    <small class="text-muted">
                        <i class="fas fa-info-circle me-1"></i>
                        Busque por qualquer informação: telefone, nome, endereço, etc.
                    </small>
                </div>
                <div class="col-md-4 text-end">
                    <div class="loading-spinner me-3">
                        <i class="fas fa-spinner fa-spin"></i> Buscando...
                    </div>
                    <button class="btn btn-criar" onclick="abrirFormularioNovoCliente()">
                        <i class="fas fa-user-plus me-2"></i>
                        Novo Cliente
                    </button>
                </div>
            </div>

            <!-- Resultados -->
            <div id="resultados" class="mt-4"></div>
            
            <!-- Sugestões -->
            <div id="sugestoes" class="mt-3"></div>
        </div>

        <!-- Modal Novo Cliente -->
        <div class="modal fade" id="modalNovoCliente" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">
                            <i class="fas fa-user-plus me-2"></i>
                            Cadastrar Novo Cliente
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formNovoCliente">
                            <!-- Dados Pessoais -->
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Nome *</label>
                                    <input type="text" name="nome" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Telefone *</label>
                                    <input type="text" name="telefone" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="row mt-3">
                                <div class="col-md-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" class="form-control">
                                </div>
                            </div>

                            <hr>
                            <h6><i class="fas fa-map-marker-alt me-2"></i>Endereço para Entrega</h6>

                            <!-- Endereço -->
                            <div class="row">
                                <div class="col-md-8">
                                    <label class="form-label">Rua *</label>
                                    <input type="text" name="endereco_rua" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Número *</label>
                                    <input type="text" name="endereco_numero" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="form-label">Complemento</label>
                                    <input type="text" name="endereco_complemento" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Bairro *</label>
                                    <input type="text" name="endereco_bairro" class="form-control" required>
                                </div>
                            </div>
                            
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <label class="form-label">Cidade *</label>
                                    <input type="text" name="endereco_cidade" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">CEP *</label>
                                    <input type="text" name="endereco_cep" class="form-control" required>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="criarNovoCliente()">
                            <i class="fas fa-save me-2"></i>
                            Criar Cliente
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        const BASE_URL = 'http://127.0.0.1:8000/api';
        let timeoutBusca = null;

        // Auto-busca conforme usuário digita
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const termo = e.target.value.trim();
            
            clearTimeout(timeoutBusca);
            
            if (termo.length >= 3) {
                timeoutBusca = setTimeout(() => {
                    buscarClientes(termo);
                }, 300);
            } else {
                document.getElementById('resultados').innerHTML = '';
                document.getElementById('sugestoes').innerHTML = '';
            }
        });

        async function buscarClientes(termo) {
            mostrarLoading(true);
            
            try {
                const response = await fetch(`${BASE_URL}/clientes/buscar-delivery?busca=${encodeURIComponent(termo)}&limite=10`);
                const data = await response.json();
                
                if (data.success) {
                    exibirResultados(data.data);
                    exibirSugestoes(data.sugestoes);
                } else {
                    exibirErro('Erro na busca: ' + data.message);
                }
            } catch (error) {
                exibirErro('Erro de conexão: ' + error.message);
            } finally {
                mostrarLoading(false);
            }
        }

        function exibirResultados(clientes) {
            const container = document.getElementById('resultados');
            
            if (clientes.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info text-center">
                        <i class="fas fa-search me-2"></i>
                        Nenhum cliente encontrado. Que tal criar um novo?
                    </div>
                `;
                return;
            }

            let html = `<h6><i class="fas fa-users me-2"></i>${clientes.length} cliente(s) encontrado(s):</h6>`;
            
            clientes.forEach(cliente => {
                const temEndereco = cliente.tem_endereco;
                const badgeEndereco = temEndereco 
                    ? `<span class="badge endereco-badge"><i class="fas fa-home me-1"></i>Endereço OK</span>`
                    : `<span class="badge sem-endereco-badge"><i class="fas fa-exclamation-triangle me-1"></i>Sem endereço</span>`;
                
                const estatisticas = cliente.total_pedidos > 0 
                    ? `<span class="badge stats-badge me-1">${cliente.total_pedidos} pedidos</span>`
                    : '';
                    
                html += `
                    <div class="cliente-card fade-in p-3" data-cliente-id="${cliente.id}">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h6 class="mb-1">
                                    <i class="fas fa-user me-2 text-primary"></i>
                                    ${cliente.nome}
                                    ${badgeEndereco}
                                    ${estatisticas}
                                </h6>
                                <p class="mb-1 text-muted">
                                    <i class="fas fa-phone me-1"></i> ${cliente.telefone}
                                    ${cliente.email ? `<span class="ms-3"><i class="fas fa-envelope me-1"></i> ${cliente.email}</span>` : ''}
                                </p>
                                ${temEndereco ? `
                                    <p class="mb-0 text-success">
                                        <i class="fas fa-map-marker-alt me-1"></i>
                                        ${cliente.endereco_completo}
                                    </p>
                                ` : `
                                    <p class="mb-0 text-warning">
                                        <i class="fas fa-exclamation-triangle me-1"></i>
                                        Endereço não cadastrado
                                    </p>
                                `}
                                ${cliente.ultimo_pedido ? `
                                    <small class="text-muted">
                                        <i class="fas fa-clock me-1"></i>
                                        Último pedido: ${cliente.ultimo_pedido}
                                    </small>
                                ` : ''}
                            </div>
                            <div class="col-md-4 text-end">
                                <button class="btn btn-selecionar btn-sm" onclick="selecionarCliente(${cliente.id}, '${cliente.nome}')">
                                    <i class="fas fa-check me-1"></i>
                                    Selecionar
                                </button>
                                ${!temEndereco ? `
                                    <button class="btn btn-warning btn-sm mt-1 d-block" onclick="editarEnderecoCliente(${cliente.id})">
                                        <i class="fas fa-edit me-1"></i>
                                        Adicionar Endereço
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function exibirSugestoes(sugestoes) {
            const container = document.getElementById('sugestoes');
            
            if (sugestoes.length === 0) {
                container.innerHTML = '';
                return;
            }
            
            let html = '';
            
            sugestoes.forEach(sugestao => {
                if (sugestao.tipo === 'criar_cliente') {
                    html += `
                        <div class="sugestao-card">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <i class="fas fa-lightbulb me-2"></i>
                                    <strong>Sugestão:</strong> ${sugestao.texto}
                                </div>
                                <button class="btn btn-light btn-sm" onclick="criarClienteComTelefone('${sugestao.dados.telefone}')">
                                    <i class="fas fa-plus me-1"></i>
                                    Criar Agora
                                </button>
                            </div>
                        </div>
                    `;
                }
            });
            
            container.innerHTML = html;
        }

        function mostrarLoading(show) {
            document.querySelector('.loading-spinner').style.display = show ? 'inline-block' : 'none';
        }

        function exibirErro(mensagem) {
            document.getElementById('resultados').innerHTML = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    ${mensagem}
                </div>
            `;
        }

        function selecionarCliente(clienteId, nomeCliente) {
            alert(`Cliente selecionado: ${nomeCliente} (ID: ${clienteId})\\n\\nAqui você integraria com o sistema de pedidos!`);
        }

        function abrirFormularioNovoCliente() {
            const modal = new bootstrap.Modal(document.getElementById('modalNovoCliente'));
            modal.show();
        }

        function criarClienteComTelefone(telefone) {
            document.querySelector('input[name="telefone"]').value = telefone;
            abrirFormularioNovoCliente();
        }

        async function criarNovoCliente() {
            const form = document.getElementById('formNovoCliente');
            const formData = new FormData(form);
            
            const dados = {};
            formData.forEach((value, key) => {
                dados[key] = value;
            });
            
            try {
                const response = await fetch(`${BASE_URL}/clientes/buscar-ou-criar-delivery`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(dados)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('modalNovoCliente')).hide();
                    
                    alert(`✅ Cliente ${result.created ? 'criado' : 'atualizado'} com sucesso!\\n\\n` +
                          `Nome: ${result.data.nome}\\n` +
                          `Telefone: ${result.data.telefone}\\n` +
                          `Endereço: ${result.endereco_completo}`);
                    
                    // Limpar busca e mostrar o cliente criado
                    document.getElementById('searchInput').value = dados.telefone;
                    buscarClientes(dados.telefone);
                    
                    form.reset();
                } else {
                    alert('❌ Erro: ' + result.message);
                }
            } catch (error) {
                alert('❌ Erro de conexão: ' + error.message);
            }
        }

        function editarEnderecoCliente(clienteId) {
            alert(`Funcionalidade em desenvolvimento: Editar endereço do cliente ${clienteId}`);
        }

        // Inicialização
        console.log('🚚 Sistema de Busca de Clientes para Delivery carregado!');
        console.log('📡 API Base:', BASE_URL);
    </script>
</body>
</html>
