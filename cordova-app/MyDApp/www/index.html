<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#EA1D2C">
    <meta name="description" content="Faça seus pedidos online no MyD Bar & Restaurantes">
    
    <!-- Cordova CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; object-src 'none'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' http://myd.local http://localhost https:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https: http:;">
    
    <title>MyD Bar & Restaurantes - Delivery</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="mt-3">Carregando...</p>
    </div>

    <!-- App Container -->
    <div id="appContainer" class="app-container d-none">
        
        <!-- Header -->
        <header class="app-header">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center py-3">
                    <div>
                        <h5 class="mb-0 text-white">
                            <i class="fas fa-utensils me-2"></i>MyD Bar & Restaurantes
                        </h5>
                        <small class="text-white-50" id="userGreeting">Bem-vindo!</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-light" onclick="toggleDarkMode()" title="Alternar modo escuro">
                            <i class="fas fa-moon" id="darkModeIcon"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-light" onclick="showProfile()">
                            <i class="fas fa-user"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-content">
            <div id="mainContent">
                <!-- Conteúdo dinâmico será carregado aqui -->
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showHome()">
                <i class="fas fa-home"></i>
                <span>Início</span>
            </div>
            <div class="nav-item" onclick="showProductDetail()">
                <i class="fas fa-utensils"></i>
                <span>Cardápio</span>
            </div>
            <div class="nav-item" onclick="showCart()">
                <i class="fas fa-shopping-cart"></i>
                <span>Carrinho</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
            <div class="nav-item" onclick="showOrders()">
                <i class="fas fa-receipt"></i>
                <span>Pedidos</span>
            </div>
        </nav>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cordova JS -->
    <script type="text/javascript" src="cordova.js"></script>
    <!-- App Config -->
    <script src="js/config.js"></script>
    <!-- App JS -->
    <script src="js/dark-mode.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
