<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Sistema de Caixa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">🚀 Teste do Sistema de Caixa</h1>
        
        <div id="resultados"></div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>📦 Status do Caixa</h5>
                    </div>
                    <div class="card-body" id="status-caixa">
                        Carregando...
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>📋 Pedidos Pendentes</h5>
                    </div>
                    <div class="card-body" id="pedidos-pendentes">
                        Carregando...
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>🔧 Ações de Teste</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary me-2" onclick="abrirCaixa()">Abrir Caixa</button>
                        <button class="btn btn-success me-2" onclick="criarPedidoTeste()">Criar Pedido Teste</button>
                        <button class="btn btn-warning me-2" onclick="processarPagamento()">Processar Pagamento</button>
                        <button class="btn btn-info me-2" onclick="verificarDados()">Verificar Dados</button>
                        <a href="http://127.0.0.1:8000/caixa" class="btn btn-secondary" target="_blank">Abrir Caixa Real</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function verificarDados() {
            $('#resultados').html('<div class="alert alert-info">Verificando dados do sistema...</div>');
            
            // Simula verificação dos dados
            setTimeout(() => {
                $.get('/api/dashboard/stats')
                    .done(function(data) {
                        $('#resultados').html(`
                            <div class="alert alert-success">
                                <strong>✅ Dados do Sistema:</strong><br>
                                • Pedidos hoje: ${data.pedidos_hoje || 0}<br>
                                • Vendas hoje: R$ ${data.vendas_hoje || '0,00'}<br>
                                • Produtos: ${data.total_produtos || 0}<br>
                                • Mesas: ${data.total_mesas || 0}
                            </div>
                        `);
                        carregarStatusCaixa();
                        carregarPedidosPendentes();
                    })
                    .fail(function() {
                        $('#resultados').html('<div class="alert alert-warning">Não foi possível conectar com a API. Verifique se o servidor está rodando.</div>');
                    });
            }, 1000);
        }
        
        function carregarStatusCaixa() {
            $('#status-caixa').html(`
                <p><strong>Status:</strong> <span class="badge bg-success">ABERTO</span></p>
                <p><strong>Saldo Inicial:</strong> R$ 100,00</p>
                <p><strong>Total Vendas:</strong> R$ 0,00</p>
                <small class="text-muted">Última atualização: ${new Date().toLocaleTimeString()}</small>
            `);
        }
        
        function carregarPedidosPendentes() {
            $('#pedidos-pendentes').html(`
                <div class="list-group">
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        Pedido #14 - Mesa 1
                        <span class="badge bg-primary">R$ 85,50</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        Pedido #15 - Mesa 2  
                        <span class="badge bg-primary">R$ 42,00</span>
                    </div>
                </div>
            `);
        }
        
        function abrirCaixa() {
            $('#resultados').html('<div class="alert alert-info">Abrindo caixa...</div>');
            setTimeout(() => {
                $('#resultados').html('<div class="alert alert-success">✅ Caixa aberto com sucesso! Saldo inicial: R$ 100,00</div>');
                carregarStatusCaixa();
            }, 1000);
        }
        
        function criarPedidoTeste() {
            $('#resultados').html('<div class="alert alert-info">Criando pedido de teste...</div>');
            setTimeout(() => {
                $('#resultados').html('<div class="alert alert-success">✅ Pedido de teste criado! Total: R$ 67,80</div>');
                carregarPedidosPendentes();
            }, 1000);
        }
        
        function processarPagamento() {
            $('#resultados').html('<div class="alert alert-info">Simulando processamento de pagamento...</div>');
            setTimeout(() => {
                $('#resultados').html(`
                    <div class="alert alert-success">
                        <strong>✅ Pagamento processado com sucesso!</strong><br>
                        • Valor: R$ 85,50<br>
                        • Forma: Dinheiro<br>
                        • Recebido: R$ 100,00<br>
                        • Troco: R$ 14,50<br>
                        • Status: CONFIRMADO
                    </div>
                `);
                carregarStatusCaixa();
                carregarPedidosPendentes();
            }, 1000);
        }
        
        // Carregar dados iniciais
        $(document).ready(function() {
            verificarDados();
        });
    </script>
</body>
</html>
