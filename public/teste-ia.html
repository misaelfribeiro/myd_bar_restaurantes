<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da Carla - IA da EatsFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <h1 class="text-center mb-2">🧠 Carla - IA da EatsFood</h1>
        <p class="text-center text-muted mb-5">Inteligência Artificial Proprietária com Aprendizado Neural</p>
        
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card bg-secondary">
                    <div class="card-body">
                        <h5 class="card-title">💬 Chat com a Carla</h5>
                        
                        <div id="chat-history" class="mb-3 p-3 bg-dark rounded" style="height: 400px; overflow-y: auto;">
                            <!-- Histórico de mensagens -->
                        </div>
                        
                        <div class="input-group">
                            <input type="text" id="message-input" class="form-control" placeholder="Digite sua mensagem...">
                            <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
                        </div>
                        
                        <div class="mt-3">
                            <h6>Exemplos para testar:</h6>
                            <div class="btn-group-vertical w-100">
                                <button class="btn btn-sm btn-outline-light" onclick="testMessage('oi')">Oi</button>
                                <button class="btn btn-sm btn-outline-light" onclick="testMessage('quero uma pizza')">Quero uma pizza</button>
                                <button class="btn btn-sm btn-outline-light" onclick="testMessage('mostra o cardápio')">Mostra o cardápio</button>
                                <button class="btn btn-sm btn-outline-light" onclick="testMessage('meus pedidos')">Meus pedidos</button>
                                <button class="btn btn-sm btn-outline-light" onclick="testMessage('status da entrega')">Status da entrega</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card bg-secondary mt-3">
                    <div class="card-body">
                        <h5 class="card-title">📊 Estatísticas da IA</h5>
                        <div id="stats-content">
                            <button class="btn btn-info" onclick="loadStats()">Carregar Estatísticas</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sessionToken = null;
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;
            
            addMessageToChat('Você', message, 'primary');
            input.value = '';
            
            try {
                const response = await fetch('/api/ai/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        session_token: sessionToken
                    })
                });
                
                const data = await response.json();
                console.log('Resposta da IA:', data);
                
                if (data.success) {
                    const result = data.data;
                    sessionToken = result.session_token;
                    
                    addMessageToChat('Carla (EatsFood)', result.response, 'success');
                    
                    // Mostra detalhes técnicos
                    const details = `
                        <small class="text-muted">
                            Intent: ${result.intent} | 
                            Confidence: ${(result.confidence * 100).toFixed(1)}% | 
                            Action: ${result.action || 'none'}
                        </small>
                    `;
                    addMessageToChat('', details, 'info');
                } else {
                    addMessageToChat('Erro', data.message, 'danger');
                }
                
            } catch (error) {
                console.error('Erro:', error);
                addMessageToChat('Erro', 'Falha ao comunicar com a IA', 'danger');
            }
        }
        
        function testMessage(msg) {
            document.getElementById('message-input').value = msg;
            sendMessage();
        }
        
        function addMessageToChat(sender, message, type) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `alert alert-${type} mb-2`;
            messageDiv.innerHTML = sender ? `<strong>${sender}:</strong> ${message}` : message;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        async function loadStats() {
            try {
                const response = await fetch('/api/ai/stats');
                const data = await response.json();
                console.log('Estatísticas:', data);
                
                if (data.success) {
                    const stats = data.data;
                    const statsContent = document.getElementById('stats-content');
                    statsContent.innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                                <h6>🧠 Rede Neural</h6>
                                <ul>
                                    <li>Total de neurônios: ${stats.neurons.total}</li>
                                    <li>Input: ${stats.neurons.input}</li>
                                    <li>Hidden: ${stats.neurons.hidden}</li>
                                    <li>Output: ${stats.neurons.output}</li>
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <h6>🔗 Sinapses</h6>
                                <ul>
                                    <li>Total: ${stats.synapses.total}</li>
                                    <li>Peso médio: ${(stats.synapses.avg_weight || 0).toFixed(4)}</li>
                                    <li>Atualizações: ${stats.synapses.total_updates}</li>
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <h6>📚 Treinamento</h6>
                                <ul>
                                    <li>Total de dados: ${stats.training_data.total}</li>
                                    <li>Treinados: ${stats.training_data.trained}</li>
                                    <li>Pendentes: ${stats.training_data.pending}</li>
                                    <li>Taxa de acerto: ${(stats.training_data.correct_rate * 100).toFixed(1)}%</li>
                                    <li>Confiança média: ${(stats.training_data.avg_confidence * 100).toFixed(1)}%</li>
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <h6>🎯 Contextos</h6>
                                <ul>
                                    <li>Total: ${stats.contexts.total}</li>
                                    <li>Ativos: ${stats.contexts.active}</li>
                                    <li>Uso total: ${stats.contexts.total_usage}</li>
                                    <li>Taxa de sucesso: ${(stats.contexts.avg_success_rate * 100).toFixed(1)}%</li>
                                </ul>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erro ao carregar stats:', error);
            }
        }
        
        // Enter para enviar
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Carrega stats ao iniciar
        loadStats();
        
        addMessageToChat('Sistema', '🧠 Carla inicializada! Sou a assistente virtual da EatsFood. Envie uma mensagem para testar!', 'info');
    </script>
</body>
</html>
