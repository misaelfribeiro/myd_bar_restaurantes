<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Layout</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- CSS Extras -->
    <link href="css/layout-extras.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>Teste de Carregamento CSS</h1>
        
        <div class="page-header">
            <h1 class="page-title">
                <i class="fas fa-tags me-2"></i>
                Teste de Page Header
            </h1>
            <p class="page-subtitle">Este é um subtitle de teste</p>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="stats-icon bg-primary">
                        <i class="fas fa-tags"></i>
                    </div>
                    <div class="stats-content">
                        <h3>10</h3>
                        <p>Total de Teste</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="stats-icon bg-success">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="stats-content">
                        <h3>25</h3>
                        <p>Itens Vinculados</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="stats-icon bg-warning">
                        <i class="fas fa-chart-bar"></i>
                    </div>
                    <div class="stats-content">
                        <h3>2.5</h3>
                        <p>Média</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="filters-card mb-4">
            <div class="row">
                <div class="col-md-6">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar..." class="form-control">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select">
                        <option>Ordenar por Nome</option>
                        <option>Ordenar por Data</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-primary w-100">
                        <i class="fas fa-sync-alt me-2"></i>
                        Atualizar
                    </button>
                </div>
            </div>
        </div>

        <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <h3>Nenhum item encontrado</h3>
            <p>Não há itens para exibir no momento</p>
            <button class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>
                Adicionar Item
            </button>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
