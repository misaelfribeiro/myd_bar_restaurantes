<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Status - MyD Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .simulator-card {
            max-width: 600px;
            margin: 0 auto;
        }
        .status-btn {
            margin: 5px;
            min-width: 150px;
        }
        .current-status {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="simulator-card">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-sliders-h me-2"></i>
                        Simulador de Status de Pedido
                    </h4>
                </div>
                <div class="card-body">
                    <div id="currentStatus" class="current-status text-center">
                        <i class="fas fa-spinner fa-spin"></i> Carregando...
                    </div>
                    
                    <div id="pedidoInfo" class="alert alert-info">
                        <strong>Instruções:</strong>
                        <ol class="mb-0 mt-2">
                            <li>Abra o app cliente em outra aba</li>
                            <li>Faça login e veja um pedido</li>
                            <li>Clique nos botões abaixo para mudar o status</li>
                            <li>Observe a atualização automática no app (a cada 5 segundos)</li>
                        </ol>
                    </div>
                    
                    <h6 class="fw-bold mb-3">Mudar Status:</h6>
                    
                    <div class="d-flex flex-wrap justify-content-center">
                        <button class="btn btn-warning status-btn" onclick="mudarStatus('aberto')">
                            <i class="fas fa-clock"></i> Aguardando
                        </button>
                        <button class="btn btn-info status-btn" onclick="mudarStatus('confirmado')">
                            <i class="fas fa-check"></i> Confirmado
                        </button>
                        <button class="btn btn-warning status-btn" onclick="mudarStatus('preparando')">
                            <i class="fas fa-fire"></i> Em Preparo
                        </button>
                        <button class="btn btn-success status-btn" onclick="mudarStatus('pronto')">
                            <i class="fas fa-check-circle"></i> Pronto
                        </button>
                        <button class="btn btn-primary status-btn" onclick="mudarStatus('saiu_entrega')">
                            <i class="fas fa-motorcycle"></i> Saiu p/ Entrega
                        </button>
                        <button class="btn btn-success status-btn" onclick="mudarStatus('entregue')">
                            <i class="fas fa-flag-checkered"></i> Entregue
                        </button>
                        <button class="btn btn-danger status-btn" onclick="mudarStatus('cancelado')">
                            <i class="fas fa-times"></i> Cancelado
                        </button>
                    </div>
                    
                    <div id="resultado" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pedidoAtual = null;

        async function carregarPedido() {
            try {
                const response = await fetch('/api/app/pedidos');
                const data = await response.json();
                const pedidos = data.data || data || [];
                
                if (pedidos.length > 0) {
                    pedidoAtual = pedidos[0];
                    atualizarInterface();
                } else {
                    document.getElementById('currentStatus').innerHTML = `
                        <div class="text-danger">
                            <i class="fas fa-exclamation-triangle"></i>
                            Nenhum pedido encontrado!
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('currentStatus').innerHTML = `
                    <div class="text-danger">
                        <i class="fas fa-exclamation-circle"></i>
                        Erro ao carregar pedido
                    </div>
                `;
            }
        }

        function atualizarInterface() {
            if (!pedidoAtual) return;
            
            const statusLabels = {
                'aberto': '⏰ Aguardando',
                'confirmado': '✅ Confirmado',
                'preparando': '🔥 Em Preparo',
                'pronto': '✓ Pronto',
                'saiu_entrega': '🏍️ Saiu para Entrega',
                'entregue': '🎉 Entregue',
                'cancelado': '❌ Cancelado'
            };
            
            document.getElementById('currentStatus').innerHTML = `
                <div class="mb-2">Pedido #${pedidoAtual.id}</div>
                <div class="text-primary">${statusLabels[pedidoAtual.status] || pedidoAtual.status}</div>
            `;
            
            document.getElementById('pedidoInfo').innerHTML = `
                <strong>Pedido Selecionado:</strong> #${pedidoAtual.id}<br>
                <strong>Total:</strong> R$ ${parseFloat(pedidoAtual.total).toFixed(2)}<br>
                <strong>Cliente ID:</strong> ${pedidoAtual.delivery?.cliente_id || 'N/A'}
            `;
        }

        async function mudarStatus(novoStatus) {
            if (!pedidoAtual) {
                alert('Nenhum pedido selecionado!');
                return;
            }
            
            try {
                const response = await fetch(`/api/pedidos/${pedidoAtual.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ status: novoStatus })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    pedidoAtual.status = novoStatus;
                    atualizarInterface();
                    
                    document.getElementById('resultado').innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show">
                            <i class="fas fa-check-circle"></i>
                            Status atualizado para: <strong>${novoStatus}</strong>
                            <br><small>Aguarde 5 segundos e veja a atualização no app!</small>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                } else {
                    throw new Error(data.message || 'Erro ao atualizar');
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('resultado').innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show">
                        <i class="fas fa-exclamation-circle"></i>
                        Erro ao atualizar status: ${error.message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
            }
        }

        // Carregar pedido ao iniciar
        carregarPedido();
        
        // Atualizar a cada 10 segundos
        setInterval(carregarPedido, 10000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
