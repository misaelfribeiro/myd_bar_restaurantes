<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyD">
    <meta name="theme-color" content="#EA1D2C">
    <meta name="description" content="App de delivery MyD Bar & Restaurantes">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <title>MyD - Delivery</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .app-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #EA1D2C 0%, #c41625 100%);
            color: white;
            flex-direction: column;
            gap: 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .text {
            font-size: 18px;
            font-weight: 500;
        }
        
        .error {
            background: #f44336;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .error h2 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .error p {
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .error button {
            background: white;
            color: #f44336;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        
        @media (display-mode: standalone) {
            body {
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="app-loader">
        <div class="spinner"></div>
        <div class="text">Carregando MyD...</div>
    </div>
    
    <div class="error" id="error">
        <h2>⚠️ Erro ao conectar</h2>
        <p id="error-msg"></p>
        <button onclick="retryConnection()">Tentar Novamente</button>
    </div>
    
    <script>
        // Configuração
        const APP_URL = 'http://localhost/app-cliente/';
        const TIMEOUT = 5000; // 5 segundos
        
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('[WRAPPER] SW registrado'))
                    .catch(err => console.log('[WRAPPER] SW erro:', err));
            });
        }
        
        // Tentar conectar ao servidor
        function loadApp() {
            const timeout = setTimeout(() => {
                showError('Timeout: Servidor não respondeu em ' + (TIMEOUT/1000) + 's');
            }, TIMEOUT);
            
            fetch(APP_URL)
                .then(res => {
                    clearTimeout(timeout);
                    if (res.ok) {
                        // Redirecionar para o app
                        window.location.href = APP_URL;
                    } else {
                        throw new Error('Resposta HTTP ' + res.status);
                    }
                })
                .catch(err => {
                    clearTimeout(timeout);
                    showError('Erro de conexão: ' + err.message + '<br>Verifique se o servidor está rodando em ' + APP_URL);
                });
        }
        
        function showError(msg) {
            document.querySelector('.error').classList.add('show');
            document.getElementById('error-msg').innerHTML = msg;
        }
        
        function retryConnection() {
            document.querySelector('.error').classList.remove('show');
            loadApp();
        }
        
        // Iniciar ao carregar
        window.addEventListener('load', loadApp);
        
        // Tentar novamente a cada 3 segundos se offline
        if (!navigator.onLine) {
            setInterval(loadApp, 3000);
            window.addEventListener('online', loadApp);
        }
    </script>
</body>
</html>
